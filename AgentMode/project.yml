name: Noesis
options:
  bundleIdPrefix: com.noesis
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: Noesis
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Noesis:
    type: application
    platform: macOS
    sources:
      - path: AgentMode
        excludes:
          - "**/*.md"
    info:
      path: AgentMode/Info.plist
      properties:
        CFBundleName: Noesis
        CFBundleDisplayName: Noesis
        CFBundleIdentifier: com.noesis.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.2.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleIconFile: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noesis.app
        INFOPLIST_FILE: AgentMode/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
